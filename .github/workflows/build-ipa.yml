name: Build IPA for ESign
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix icon
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Set up Xcode environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -workspace *.xcworkspace | awk '/Schemes:/{f=1;next} f && NF{print $1; exit}')
          echo "Building scheme: $SCHEME"
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/my-safety-app.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive \
            -archivePath build/my-safety-app.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ../IPA
          ls -lh ../IPA/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: IPA/app.ipa
