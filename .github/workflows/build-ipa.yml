name: Build IPA for My Safety App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install deps
        run: npm install

      # Prebuild iOS
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
      
      # Setup Xcode environment
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'  # Use the latest version of Xcode

      # Install CocoaPods dependencies
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      
      # Create exportOptions.plist
      - name: Create exportOptions.plist
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.yourcompany.mysafetyapp</key>
                  <string>Your Provisioning Profile Name</string>
              </dict>
          </dict>
          </plist>' > exportOptions.plist
      
      # Archive the project
      - name: Archive the project
        run: |
          cd ios
          xcodebuild archive \
            -workspace my-safety-app.xcworkspace \
            -scheme my-safety-app \
            -configuration Release \
            -archivePath build/my-safety-app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      
      # Export the archive to IPA
      - name: Export the archive to IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/my-safety-app.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ../IPA
      
      # Upload the IPA as an artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: IPA/my-safety-app.ipa
